<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مذاكرتي AI 🎓 — معلمك الذكي الخاص</title>
<meta name="theme-color" content="#4a90d9">
<meta name="description" content="معلم ذكي يشرح ويسأل ويجيب بالصوت والكتابة بالذكاء الاصطناعي الحقيقي">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --text:#1e2a38; --muted:#6b7a8d;
  --primary:#4a90d9; --primary2:#7b5ce0; --good:#2ecc71; --bad:#e74c3c; --gold:#f1c40f;
  --bubble-ai:#ffffff; --bubble-user:linear-gradient(135deg,#4a90d9,#7b5ce0);
  --shadow:0 4px 18px rgba(30,42,56,.10);
  --code-bg:#f0f4f8;
}
body.dark{
  --bg:#0e141b; --card:#1a232e; --text:#e8eef5; --muted:#93a5b8;
  --bubble-ai:#1f2b38; --shadow:0 4px 18px rgba(0,0,0,.45);
  --code-bg:#141c26;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{margin:0; font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; transition:background .3s,color .3s;}

/* ====== الشريط العلوي ====== */
header{position:relative; z-index:20; background:linear-gradient(135deg,#4a90d9,#7b5ce0); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; box-shadow:0 2px 14px rgba(0,0,0,.2);}
header .logo{font-weight:900; font-size:1.15rem; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;}
.hbtn{border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:12px; min-height:40px; padding:6px 12px; font-family:inherit; font-size:.92rem; font-weight:700; cursor:pointer; transition:transform .15s, background .2s;}
.hbtn:active{transform:scale(.9);}
.hbtn:hover{background:rgba(255,255,255,.28);}
header .spacer{flex:1;}
.badge{background:rgba(255,255,255,.22); color:#fff; border-radius:999px; padding:4px 12px; font-weight:900; font-size:.9rem; white-space:nowrap;}
.badge.fire{background:rgba(255,122,69,.9);}

/* ====== تبويبات ====== */
.tabs{display:flex; background:var(--card); box-shadow:var(--shadow);}
.tab{flex:1; border:none; background:none; color:var(--muted); font-family:inherit; font-weight:900; font-size:.95rem; padding:12px 4px; cursor:pointer; border-bottom:3px solid transparent; min-height:50px;}
.tab.active{color:var(--primary); border-bottom-color:var(--primary);}

/* ====== الشاشات ====== */
main{flex:1; overflow:hidden; position:relative;}
.screen{display:none; height:100%; overflow-y:auto; padding:16px 14px 20px; animation:fadeIn .3s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
@keyframes pop{0%{transform:scale(.6);} 60%{transform:scale(1.1);} 100%{transform:scale(1);}}
@keyframes dots{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-4px);}}
@keyframes confettiFall{to{transform:translateY(105vh) rotate(720deg); opacity:.6;}}

/* ====== الدردشة ====== */
#chatLog{padding-bottom:8px;}
.msg{display:flex; gap:10px; margin-bottom:14px; animation:fadeIn .3s;}
.msg.user{flex-direction:row-reverse;}
.avatar{width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:var(--shadow);}
.msg.ai .avatar{background:linear-gradient(135deg,#4a90d9,#7b5ce0); color:#fff;}
.msg.user .avatar{background:var(--gold);}
.bubble{background:var(--bubble-ai); border-radius:18px; padding:13px 16px; max-width:85%; box-shadow:var(--shadow); font-size:1rem; line-height:1.9; position:relative; word-break:break-word;}
.msg.user .bubble{background:var(--bubble-user); color:#fff; border-bottom-left-radius:4px;}
.msg.ai .bubble{border-bottom-right-radius:4px;}

/* تنسيق محتوى الماركداون داخل الفقاعات */
.bubble h2, .bubble h3, .bubble h4{margin:10px 0 6px; font-weight:900; color:inherit;}
.bubble p{margin:0 0 8px;}
.bubble p:last-child{margin-bottom:0;}
.bubble ul, .bubble ol{margin:6px 0 10px; padding-right:24px; padding-left:0;}
.bubble li{margin-bottom:4px;}
.bubble code{background:var(--code-bg); padding:2px 6px; border-radius:6px; font-family:monospace; font-size:.9em;}
.bubble pre{background:var(--code-bg); padding:10px; border-radius:10px; overflow-x:auto; font-family:monospace;}
.bubble blockquote{margin:8px 0; padding:6px 12px; border-right:4px solid var(--primary); background:rgba(74,144,217,.08); border-radius:4px;}

.bubble .src{display:inline-block; margin-top:10px; padding:3px 10px; background:rgba(74,144,217,.12); color:var(--primary); font-size:.78rem; font-weight:800; border-radius:999px;}
body.dark .bubble .src{background:rgba(74,144,217,.25); color:#7ab6f6;}
.bubble-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.mini{border:none; border-radius:10px; padding:7px 12px; font-family:inherit; font-weight:800; font-size:.82rem; cursor:pointer; min-height:36px; transition:transform .15s, opacity .15s; display:inline-flex; align-items:center; gap:4px;}
.mini:active{transform:scale(.93);}
.mini.speak{background:rgba(74,144,217,.15); color:var(--primary);}
.mini.quiz{background:var(--good); color:#fff;}
.mini.again{background:rgba(241,196,15,.2); color:#8a6d00;}
body.dark .mini.again{color:var(--gold);}
.mini.copy{background:rgba(107,122,141,.15); color:var(--muted);}
.mini.copy.copied{background:var(--good); color:#fff;}

.typing-indicator{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; font-weight:700;}
.typing{display:inline-flex; gap:5px; padding:4px;}
.typing i{width:8px; height:8px; border-radius:50%; background:var(--primary); animation:dots 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.15s;} .typing i:nth-child(3){animation-delay:.3s;}

/* شريط تحكم الدردشة السريع */
.chat-toolbar{display:flex; justify-content:space-between; align-items:center; padding:4px 4px 10px; font-size:.85rem;}
.chat-status{color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px;}
.chat-status .dot{width:8px; height:8px; border-radius:50%; background:var(--good); display:inline-block;}
.clear-chat-btn{border:none; background:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:.82rem; cursor:pointer; padding:4px 8px; border-radius:8px;}
.clear-chat-btn:hover{color:var(--bad); background:rgba(231,76,60,.1);}

/* شرائح الاقتراحات */
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 12px 10px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; border:1.5px solid var(--primary); background:var(--card); color:var(--primary); border-radius:999px; padding:8px 14px; font-family:inherit; font-weight:700; font-size:.86rem; cursor:pointer; white-space:nowrap; min-height:38px;}
.chip:active{transform:scale(.94);}

/* شريط الإدخال */
#inputBar{display:flex; gap:8px; padding:10px 12px; background:var(--card); box-shadow:0 -2px 14px rgba(0,0,0,.08);}
#inputBar input{flex:1; border:2px solid var(--bg); background:var(--bg); color:var(--text); border-radius:14px; padding:12px 14px; font-family:inherit; font-size:1rem; outline:none; min-height:50px;}
#inputBar input:focus{border-color:var(--primary);}
.snd{border:none; border-radius:14px; width:52px; min-height:50px; font-size:1.3rem; cursor:pointer; transition:transform .15s; flex-shrink:0;}
.snd:active{transform:scale(.9);}
.snd.send{background:linear-gradient(135deg,#4a90d9,#7b5ce0); color:#fff;}
.snd.mic{background:var(--gold); color:#5c4400;}
.snd.mic.rec{background:var(--bad); color:#fff; animation:pop 1s infinite;}

/* المكتبة */
.grid{display:grid; gap:12px;}
.grid.subjects{grid-template-columns:repeat(2,1fr);}
@media(min-width:640px){ .grid.subjects{grid-template-columns:repeat(4,1fr);} }
.subj{border:none; border-radius:16px; padding:20px 10px; cursor:pointer; font-family:inherit; font-weight:900; font-size:1rem; color:#fff; min-height:86px; box-shadow:var(--shadow); transition:transform .15s; display:flex; flex-direction:column; align-items:center; gap:6px;}
.subj:active{transform:scale(.94);}
.subj .ic{font-size:1.8rem;}
.li{display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--card); border:none; border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-bottom:10px; cursor:pointer; font-family:inherit; color:var(--text); transition:transform .15s;}
.li:active{transform:scale(.97);}
.li .num{width:40px; height:40px; border-radius:10px; color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.li .lt{font-weight:700; flex:1; font-size:.98rem;}
.li .done{color:var(--good); font-weight:900; font-size:1.2rem;}

/* إحصائيات */
.stat-row{display:flex; gap:12px; flex-wrap:wrap;}
.stat{flex:1; min-width:120px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px; text-align:center;}
.stat .v{font-size:1.7rem; font-weight:900; color:var(--primary);}
.stat .l{color:var(--muted); font-size:.85rem; font-weight:700;}
.confetti{position:fixed; top:-40px; font-size:1.6rem; z-index:99; pointer-events:none; animation:confettiFall 2.6s linear forwards;}
h1.page-title{font-size:1.35rem; margin:4px 0 14px; font-weight:900;}
.empty{color:var(--muted); text-align:center; padding:30px 10px; font-weight:700;}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="switchTab('chat')">🎓 مذاكرتي AI</div>
  <div class="spacer"></div>
  <div class="badge" id="pointsBadge">🏆 0</div>
  <div class="badge fire" id="streakBadge">🔥 1</div>
  <button class="hbtn" onclick="toggleDark()" id="darkBtn" title="الوضع الليلي">🌙</button>
  <button class="hbtn" onclick="fontSize(-1)" title="تصغير الخط">A−</button>
  <button class="hbtn" onclick="fontSize(1)" title="تكبير الخط">A+</button>
</header>

<div class="tabs">
  <button class="tab active" data-t="chat" onclick="switchTab('chat')">💬 المعلم الذكي</button>
  <button class="tab" data-t="lib" onclick="switchTab('lib')">📚 المكتبة المدمجة</button>
  <button class="tab" data-t="stats" onclick="switchTab('stats')">📊 تقدمي</button>
</div>

<main>
  <!-- ======== الدردشة ======== -->
  <section id="s-chat" class="screen active">
    <div class="chat-toolbar">
      <div class="chat-status"><span class="dot"></span> <span>ذكاء اصطناعي حقيقي (مجاني بدون API Key)</span></div>
      <button class="clear-chat-btn" onclick="clearChat()">🗑️ محادثة جديدة</button>
    </div>
    <div id="chatLog"></div>
  </section>

  <!-- ======== المكتبة ======== -->
  <section id="s-lib" class="screen">
    <h1 class="page-title" id="libTitle">📚 اختر المرحلة</h1>
    <div id="libBody"></div>
  </section>

  <!-- ======== الإحصائيات ======== -->
  <section id="s-stats" class="screen">
    <h1 class="page-title">📊 لوحة تقدمك</h1>
    <div class="stat-row">
      <div class="stat"><div class="v" id="stDone">0</div><div class="l">درس مكتمل ✔</div></div>
      <div class="stat"><div class="v" id="stPoints">0</div><div class="l">نقطة 🏆</div></div>
      <div class="stat"><div class="v" id="stAcc">—</div><div class="l">دقة الإجابات 🎯</div></div>
      <div class="stat"><div class="v" id="stAsk">0</div><div class="l">سؤال للمعلم 💬</div></div>
    </div>
    <div class="card" style="background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-top:16px; font-weight:700; line-height:2;" id="streakCard"></div>
  </section>
</main>

<div class="chips" id="chips"></div>

<div id="inputBar">
  <button class="snd mic" id="micBtn" onclick="toggleMic()" title="تحدث">🎤</button>
  <input id="txt" type="text" placeholder="اسأل المعلم الذكي أي سؤال بالمنهج أو المعارف العامة..." onkeydown="if(event.key==='Enter')sendFromInput()">
  <button class="snd send" onclick="sendFromInput()" title="إرسال">➤</button>
</div>

<script>
/* ================= بنك الدروس المدمجة (للمكتبة وحالة الطوارئ عند انقطاع النت) ================= */
const DATA = [
{name:"🟢 المرحلة الابتدائية",subjects:[
{name:"الرياضيات",icon:"🔢",color:"#4a90d9",lessons:[
{t:"جمع الأعداد حتى 100",p:[
"الجمع هو عملية ضمّ مجموعتين أو أكثر من الأشياء معًا لنعرف عددها الكلي، ويُكتب بإشارة (+).",
"مثال: 35 + 27. نجمع الآحاد أولًا: 5 + 7 = 12، نكتب 2 في خانة الآحاد ونحتفظ بالواحد للعشرات. ثم نجمع العشرات: 3 + 2 + 1 (الواحد المحتفظ به) = 6. إذن الناتج 62.",
"للجمع خواص مهمة: الخاصية الإبدالية تعني أن تبديل مكان العددين لا يغيّر الناتج (3 + 5 = 5 + 3)، والخاصية التجميعية تعني أن التجميع بطريقتين مختلفتين لا يغيّر الناتج (2 + 3) + 4 = 2 + (3 + 4).",
"نصيحة ذهبية: ابدأ دائمًا بجمع الآحاد ثم العشرات، واستخدم العد التصاعدي على أصابعك إذا احتجت."],
qs:[
{q:"ناتج 25 + 13 = ؟",o:["38","28","36","48"],a:0,e:"نجمع الآحاد: 5+3=8، والعشرات: 20+10=30، فيكون الناتج 38."},
{q:"الخاصية في 7 + 4 = 4 + 7 تسمى خاصية:",o:["الإبدال","التجميع","التوزيع","الطرح"],a:0,e:"تبديل مكان العددين دون تغيير الناتج هو الخاصية الإبدالية."},
{q:"أحمد جمع 45 جنيهًا ثم أعطاه والده 30 جنيهًا. كم أصبح معه؟",o:["75","70","80","15"],a:0,e:"45 + 30 = 75 جنيهًا."},
{q:"أكمل: 50 + ... = 90",o:["40","50","60","30"],a:0,e:"90 − 50 = 40."},
{q:"ناتج 46 + 27 = ؟",o:["73","63","83","62"],a:0,e:"6+7=13 اكتب 3 واحتفظ بواحد، ثم 4+2+1=7، فالناتج 73."}]},
{t:"جدول الضرب",p:[
"الضرب هو جمعٌ متكرر: فـ 3 × 4 تعني 4 + 4 + 4 = 12، أي أخذ العدد 3 مرات متتالية.",
"حيل لتسهيل حفظ الجداول: جدول العدد 2 هو نفسه ناتج ضمّ العدد لنفسه (2×7 = 7+7 = 14)، وجدول 5 تنتهي كل نواتجه بـ 5 أو 0، وجدول 10 نضيف فيه صفرًا فقط للعدد (10×6 = 60).",
"جدول 9 له حيلة ذكية: نواتج جدول 9 مجموع رقميها دائمًا 9 (18، 27، 36، 45...).",
"التدريب المنتظم 10 دقائق يوميًا أفضل من ساعة مرة واحدة؛ اختبر نفسك بعشوائية وسجّل تقدمك."],
qs:[
{q:"ناتج 6 × 7 = ؟",o:["42","36","48","54"],a:0,e:"6 × 7 = 42 (ست مرات السبعة)."},
{q:"ناتج 9 × 4 = ؟",o:["36","32","40","45"],a:0,e:"9 × 4 = 36، ولاحظ أن 3 + 6 = 9."},
{q:"ناتج 8 × 5 = ؟",o:["40","45","35","50"],a:0,e:"نواتج جدول 5 تنتهي بـ 5 أو 0: 8 × 5 = 40."},
{q:"ناتج 7 × 7 = ؟",o:["49","42","56","63"],a:0,e:"7 × 7 = 49."},
{q:"أيّ مما يلي يمثّل 4 × 3 كجمع متكرر؟",o:["3+3+3+3","4+4","3×3","4+3+3"],a:0,e:"4 × 3 تعني 3 أربع مرات: 3+3+3+3."}]},
{t:"الكسور البسيطة",p:[
"الكسر يمثّل جزءًا من كلٍّ كامل؛ نكتبه على صورة بسط/مقام. البسط هو العدد العلوي ويبيّن الأجزاء المأخوذة، والمقام هو العدد السفلي ويبيّن عدد الأجزاء المتساوية الكلية.",
"نصف الكل هو 1/2، وربعه هو 1/4، وثلثه 1/3. لاحظ: كلما كبُر المقام صغُر الجزء؛ فالربع أصغر من النصف لأننا قسمنا الكل إلى أجزاء أكثر.",
"الكسور المتكافئة تمثّل نفس القيمة بأشكال مختلفة: 2/4 = 1/2 لأن كليهما نصف الكل.",
"تخيّل كعكة مقسومة إلى 8 قطع متساوية: لو أكلت 3 قطع فقد أكلت 3/8 من الكعكة."],
qs:[
{q:"الكسر 1/2 يُسمى:",o:["النصف","الربع","الثلث","الثمن"],a:0,e:"نصف الكل يُكتب 1/2."},
{q:"في الكسر 3/4 العدد 3 هو:",o:["البسط","المقام","الناتج","الجزء الكلي"],a:0,e:"العدد العلوي هو البسط."},
{q:"أيّ الكسرين أكبر؟",o:["1/2","1/4","متساويان","لا يمكن المقارنة"],a:0,e:"كلما صغُر المقام كبُر الجزء: النصف أكبر من الربع."},
{q:"الكسر 2/4 يساوي:",o:["1/2","1/3","2/2","3/4"],a:0,e:"2/4 تُبسَّط بالقسمة على 2 فتصبح 1/2."},
{q:"قسّمنا بيتزا إلى 8 قطع وأكلنا 3 قطع. ما الكسر الماكل؟",o:["3/8","8/3","1/3","3/5"],a:0,e:"البسط 3 (المأكول) والمقام 8 (الكل)."}]}]},
{name:"لغتي العربية",icon:"📖",color:"#e91e63",lessons:[
{t:"الحروف الهجائية",p:[
"يتكون الأبجدية العربية من 28 حرفًا مرتبة ترتيبًا هجائيًا يبدأ بالألف وينتهي بالياء.",
"تنقسم الحروف إلى قسمين: شمسية تُدغَم اللام قبلها ولا تُنطق (الشمس تُنطق الشمس)، وقمرية تُنطق فيها اللام (القمر تُنطق القمر).",
"من الحروف الشمسية: ت، ث، د، ذ، ر، ز، س، ش، ص، ض، ط، ظ، ل، ن. ومن القمرية: ب، ج، ح، خ، ع، غ، ف، ق، ك، م، هـ، و، ي، أ.",
"الحروف حركات: الضمة، والفتحة، والكسرة، والسكون، والتنوين، وهي ما يغيّر معنى الكلمة ونطقها."],
qs:[
{q:"عدد الحروف الهجائية العربية:",o:["28","26","30","25"],a:0,e:"الأبجدية العربية 28 حرفًا."},
{q:"كلمة (الشمس) تبدأ بحرف:",o:["شمسي","قمري"],a:0,e:"الشين من الحروف الشمسية فتُدغَم اللام."},
{q:"كلمة (القمر) تبدأ بحرف:",o:["قمري","شمسي"],a:0,e:"القاف من الحروف القمرية فتُنطق اللام."},
{q:"أول حرف في الأبجدية العربية:",o:["الألف","الباء","الهمزة","اللام"],a:0,e:"يبدأ الترتيب الهجائي بالألف."},
{q:"حرف اللام من الحروف:",o:["القمرية","الشمسية"],a:0,e:"اللام من الحروف الشمسية تُدغَم قبلها."}]},
{t:"الكلمة والجملة",p:[
"الكلمة هي الوحدة اللغوية الأساسية التي نعبر بها عن معنى، وتنقسم في العربية إلى ثلاثة أنواع: اسم يدل على شخص أو شيء (كتاب، محمد)، وفعل يدل على حدث في زمن (كتب، يلعب)، وحرف يربط بين الكلمات (في، على، من).",
"الجملة تتكون من كلمات مرتبة تفيد معنى مفيدًا، مثل: ذهبَ الطالبُ إلى المدرسةِ. فالجملة التي لا تفيد معنى كاملاً مثل (على الطاولة) تسمى شبه جملة.",
"الاسم يُعرَف غالبًا بأنه يسبقه ال أو يتضمن تنوينًا، والفعل يبدأ غالبًا بتاء الفاعل أو نون النسوة أو الألف والنون.",
"تدريب مفيد: خذ أي نص وظلل الأسماء بلون والأفعال بلون آخر."],
qs:[
{q:"كلمة (يشرب) من نوع:",o:["فعل","اسم","حرف","جملة"],a:0,e:"تدل على حدث يقع في زمن."},
{q:"كلمة (على) من نوع:",o:["حرف","اسم","فعل","ضمير"],a:0,e:"الحروف تربط بين الكلمات."},
{q:"أيّ مما يلي جملة مفيدة؟",o:["ذهب محمد إلى المدرسة","على الطاولة","في البيت","تحت الشجرة"],a:0,e:"الجملة المفيدة تحتاج فعلًا وفاعلًا ومعنى كاملًا."},
{q:"كلمة (العلم) من نوع:",o:["اسم","فعل","حرف","حرف جر"],a:0,e:"تدل على شيء ويسبقها ال التعريف."},
{q:"الوحدة اللغوية الأساسية هي:",o:["الكلمة","الحرف","الجملة","الفقرة"],a:0,e:"الكلمة هي اللبنة الأولى للغة."}]},
{t:"علامات الترقيم",p:[
"علامات الترقيم هي رموز تضبط الكتابة وتجعل معناها أوضح: النقطة (.) تُستخدم في نهاية الجملة الخبرية، والفاصلة (،) للوقفة القصيرة والفصل بين المعطيات، وعلامة الاستفهام (؟) في نهاية السؤال، وعلامة التعجب (!) للدهشة والأمر والنهي.",
"من علامات أخرى مهمة: النقطتان (:) قبل ذكر الأسباب والتفاصيل، والشرطة (ـ) للتعليق والحصر، والفواصل المنقوطة (;) بين جمل مترابطة.",
"قاعدة مهمة: بعد النقطة نبدأ بحرف كبير (في العربية نبدأ بخط جديد أو مسافة)، وبعد الفاصلة لا نبدأ بكبير.",
"مثال تطبيقي: ما اسمك؟ اسمي أحمد! أنا سعيد جدًا اليوم."],
qs:[
{q:"علامة نهاية الجملة الخبرية:",o:["النقطة","الاستفهام","التعجب","الفاصلة"],a:0,e:"الجملة الخبرية تنتهي بنقطة."},
{q:"علامة تُستخدم للدهشة:",o:["التعجب","النقطة","الفاصلة","النقطتان"],a:0,e:"علامة التعجب (!) للدهشة."},
{q:"علامة نهاية السؤال:",o:["الاستفهام","النقطة","التعجب","الفاصلة"],a:0,e:"الأسئلة تنتهي بعلامة الاستفهام (؟)."},
{q:"للفصل بين المعطيات المتتابعة نستخدم:",o:["الفاصلة","النقطة","التعجب","الشرطة"],a:0,e:"الفاصلة تفصل بين المعطيات."},
{q:"بعد النقطة في الإنجليزية نكتب:",o:["حرفًا كبيرًا","حرفًا صغيرًا","رقمًا","لا شيء"],a:0,e:"أول حرف بعد النقطة يكون Capital."}]}]},
{name:"العلوم",icon:"🧪",color:"#4caf50",lessons:[
{t:"أجزاء النبات",p:[
"يتكون النبات من أجذار وساق وأوراق وزهور وثمار، ولكل جزء وظيفة محددة تتكامل لبقاء النبات حيًا.",
"الجذر: يثبّت النبات في التربة ويمتص الماء والأملاح المعدنية، ويخزن الغذاء أحيانًا. والساق: يرفع الأوراق نحو الضوء وينقل الماء والغذاء بين الجذور والأوراق.",
"الأوراق هي مصنع الغذاء؛ تحتوي على المادة الخضراء (الكلوروفيل) التي تمتص ضوء الشمس وتحوّل الماء وثاني أكسيد الكربون إلى غذاء في عملية البناء الضوئي.",
"الزهرة: عضو التكاثر الذي يتحول بعد التلقيح إلى ثمرة تحمل البذور."],
qs:[
{q:"الجزء المسؤول عن امتصاص الماء:",o:["الجذر","الورقة","الزهرة","الثمرة"],a:0,e:"الجذور تمتص الماء من التربة."},
{q:"مصنع الغذاء في النبات هو:",o:["الورقة","الجذر","الساق","الثمرة"],a:0,e:"الأوراق تجري فيها عملية البناء الضوئي."},
{q:"وظيفة الساق:",o:["نقل الماء والغذاء ورفع الأوراق","امتصاص الماء","صنع البذور","التلقيح"],a:0,e:"الساق ينقل وتدعم النبات."},
{q:"تحتوي الزهرة على:",o:["أعضاء التكاثر","الكلوروفيل","الأوعية الخشبية","البذور فقط"],a:0,e:"الزهرة عضو التكاثر في النبات."},
{q:"لون الأزهار الزاهي وظيفته:",o:["جذب الحشرات للتلقيح","امتصاص الضوء","حماية البذور","تخزين الغذاء"],a:0,e:"الألوان والروائح تجذب الحشرات والطيور."}]},
{t:"حالات المادة",p:[
"المادة توجد في ثلاث حالات أساسية: الصلبة (لها شكل وحجم ثابتان مثل الحديد)، والسائلة (لها حجم ثابت لكن شكلها يتبع الإناء مثل الماء)، والغازية (لا شكل لها ولا حجم ثابت مثل الهواء).",
"الماء مادة فريدة توجد فيها الحالات الثلاث: جليد (صلب) عند درجة حرارة 0°م أو أقل، وماء سائل بين 0 و100°م، وبخار (غاز) عند 100°م فأكثر.",
"تتغير حالة المادة بالتسخين أو التبريد: التسخين يحول السائل إلى غاز (تبخر)، والتبريد يحوله إلى صلب (تجمد).",
"تنتشر الغازات في كل الفراغ المتاح لأن جزيئاتها تتحرك بحرية كبيرة، بينما جزيئات الصلب مرتبة بشدة."],
qs:[
{q:"الحالة التي لها شكل وحجم ثابتان:",o:["الصلبة","السائلة","الغازية","البلازما"],a:0,e:"المواد الصلبة تحافظ على شكلها."},
{q:"بخار الماء حالة:",o:["غازية","سائلة","صلبة","متوسطة"],a:0,e:"البخار غاز."},
{q:"عند تجميد الماء يصبح:",o:["صلبًا","غازًا","سائلًا أكثر","يتبخر"],a:0,e:"التجميد يحول السائل إلى صلب."},
{q:"الماء المغلي في الغلاية يتحول إلى:",o:["غاز","صلب","سائل أبرد","لا شيء"],a:0,e:"التسخين يحول الماء إلى بخار."},
{q:"أيّ مما يلي مادة سائلة؟",o:["عصير البرتقال","الحديد","الهواء","الخشب"],a:0,e:"العصير سائل، والحديد صلب، والهواء غاز."}]},
{t:"دورة الماء في الطبيعة",p:[
"دورة الماء هي رحلة مستمرة يقطعها الماء في الطبيعة بفعل حرارة الشمس والجاذبية، وتمر بأربع مراحل رئيسية.",
"أولًا التبخر: تسخّن الشمس مياه البحار والأنهار فتتحول إلى بخار يصعد للأعلى. ثانيًا التكاثف: يبرد البخار في طبقات الجو العليا فيتحول إلى قطرات صغيرة تكوّن الغيوم.",
"ثالثًا الهطول: تثقل القطرات فتسقط مطرًا أو ثلجًا أو بَرَدًا. رابعًا الجريان: يتجمع الماء ويجري في الأنهار عائدًا إلى البحار ليبدأ الدور من جديد.",
"تنقية الماء تتم بشكل طبيعي أثناء الدورة، لذا فالماء في الطبيعة يتجدد باستمرار."],
qs:[
{q:"تحول الماء إلى بخار يسمى:",o:["التبخر","التكاثف","الهطول","الجريان"],a:0,e:"التبخر بفعل حرارة الشمس."},
{q:"تكوّن الغيوم يحدث في مرحلة:",o:["التكاثف","التبخر","الهطول","الجريان"],a:0,e:"تكاثف البخار يكوّن الغيوم."},
{q:"نزول المطر يسمى:",o:["الهطول","التبخر","التكاثف","الجريان"],a:0,e:"المرحلة الثالثة هي الهطول."},
{q:"محرك دورة الماء في الطبيعة هو:",o:["الشمس","القمر","الرياح فقط","البراكين"],a:0,e:"حرارة الشمس تبخر الماء وتشغل الدورة."},
{q:"بعد الهطول يعود الماء إلى البحار عبر:",o:["الجريان","التبخر","التكاثف","التساقط"],a:0,e:"الأنهار تجري بالماء إلى البحار."}]}]},
{name:"اللغة الإنجليزية",icon:"🔤",color:"#ff9800",lessons:[
{t:"Alphabet & Greetings (الحروف والتحيات)",p:[
"The English alphabet has 26 letters, from A to Z. Each letter has a capital form (A) and a small form (a).",
"Common greetings: Hello / Hi = مرحبًا، Good morning = صباح الخير (تقال حتى الظهر)، Good evening = مساء الخير.",
"When someone asks: How are you? the polite answer is: I am fine, thank you. And you?",
"Goodbye = وداعًا / إلى اللقاء، Please = من فضلك، Thank you = شكرًا."],
qs:[
{q:"How many letters are there in the English alphabet?",o:["26","28","24","30"],a:0,e:"The English alphabet has 26 letters."},
{q:"(Good morning) تقال في:",o:["الصباح","المساء","الليل","أي وقت"],a:0,e:"Good morning = صباح الخير."},
{q:"الرد المهذب على (How are you?) هو:",o:["I am fine, thank you","Goodbye","Good night","Yes"],a:0,e:"The polite answer: I am fine, thank you."},
{q:"(Hello) تعني:",o:["مرحبًا","وداعًا","شكرًا","من فضلك"],a:0,e:"Hello / Hi = مرحبًا."},
{q:"آخر حرف في الأبجدية الإنجليزية:",o:["Z","Y","A","M"],a:0,e:"The alphabet ends with the letter Z."}]},
{t:"Numbers & Colors (الأرقام والألوان)",p:[
"Numbers from 1 to 10: One, Two, Three, Four, Five, Six, Seven, Eight, Nine, Ten.",
"Main colors: Red = أحمر، Blue = أزرق، Green = أخضر، Yellow = أصفر، Black = أسود، White = أبيض، Orange = برتقالي، Pink = وردي.",
"A useful pattern: ask (What color is it?) and answer (It is blue / It is red).",
"Counting practice: two red apples = تفاحتان أحمرتان. Try describing things around you in English!"],
qs:[
{q:"رقم (7) بالإنجليزية:",o:["Seven","Six","Eight","Five"],a:0,e:"Seven = سبعة."},
{q:"لون السماء غالبًا:",o:["Blue","Green","Red","Black"],a:0,e:"The sky is usually blue."},
{q:"لون العشب:",o:["Green","Yellow","Pink","White"],a:0,e:"Grass is green."},
{q:"رقم (5) بالإنجليزية:",o:["Five","Four","Six","Fifty"],a:0,e:"Five = خمسة."},
{q:"لون الشمس المرسومة:",o:["Yellow","Blue","Green","Black"],a:0,e:"The sun is usually drawn yellow."}]},
{t:"Family Members (أفراد الأسرة)",p:[
"Family vocabulary: Father = أب، Mother = أم، Brother = أخ، Sister = أخت، Grandfather = جد، Grandmother = جدة.",
"Uncle = عم/خال، Aunt = عمة/خالة، Cousin = ابن العم/الخال.",
"To introduce your family: This is my father = هذا أبي، These are my brothers = هؤلاء إخوتي.",
"Possessive adjectives: my (خاصتي)، his (خاصته)، her (خاصتها) — my mother, his sister, her brother."],
qs:[
{q:"(Father) تعني:",o:["أب","أم","جد","عم"],a:0,e:"Father = الأب."},
{q:"(Sister) تعني:",o:["أخت","أم","عمة","بنت"],a:0,e:"Sister = الأخت."},
{q:"(Grandfather) تعني:",o:["جد","أب","عم","أخ"],a:0,e:"Grandfather = الجد."},
{q:"(Mother) تعني:",o:["أم","أخت","جدة","عمة"],a:0,e:"Mother = الأم."},
{q:"ابن العم أو الخال يُسمى:",o:["Cousin","Brother","Uncle","Nephew"],a:0,e:"Cousin = ابن العم/الخال."}]}]}]},
{name:"🔵 المرحلة الإعدادية",subjects:[
{name:"الرياضيات",icon:"🔢",color:"#4a90d9",lessons:[
{t:"المعادلات البسيطة",p:[
"المعادلة تساوي بين طرفين، أحدهما أو كلاهما يحتوي على مجهول (x مثلًا)، وحل المعادلة هو إيجاد قيمة المجهول التي تحقق التساوي.",
"الأداة الأساسية هي العملية العكسية: إذا جُمع عدد مع المجهول نطرحه من الطرفين، وإذا ضُرب نُقسم، وهكذا — مع الحفاظ دائمًا على تساوي الطرفين.",
"مثال: x + 5 = 12، نطرح 5 من الطرفين فيصبح x = 7. تحقق: 7 + 5 = 12 ✓",
"خطوات منهجية: انقل الحدود الرقمية للطرف الآخر بعكس الإشارة، ثم اقسم على معامل المجهول، ثم تحقق من حلك بالتعويض."],
qs:[
{q:"حل المعادلة x + 3 = 10",o:["7","13","3","30"],a:0,e:"نطرح 3: x = 10 − 3 = 7."},
{q:"حل المعادلة 4x = 20",o:["5","16","24","80"],a:0,e:"نقسم على 4: x = 20 ÷ 4 = 5."},
{q:"حل المعادلة x − 6 = 9",o:["15","3","54","−3"],a:0,e:"نجمع 6: x = 9 + 6 = 15."},
{q:"حل المعادلة 2x = 14",o:["7","12","16","28"],a:0,e:"x = 14 ÷ 2 = 7."},
{q:"حل المعادلة x ÷ 3 = 4",o:["12","7","1","24"],a:0,e:"نضرب في 3: x = 4 × 3 = 12."}]},
{t:"النسبة المئوية",p:[
"النسبة المئوية تعني جزءًا من كل مئة، ونكتبها بإشارة %. فـ 50% تعني نصف الكل، و25% تعني ربعه، و10% تعني عشره.",
"الطريقة الأسرع للحساب: 25% = القسمة على 4، و50% = القسمة على 2، و10% = القسمة على 10، و1% = القسمة على 100.",
"مثال: 25% من 80 = 80 ÷ 4 = 20. وحساب الخصومات: خصم 20% على سعر 150 جنيهًا يعني أنك تدفع 80% فقط: 150 × 0.8 = 120 جنيهًا.",
"التحويل بين الصور: 75% = 75/100 = 3/4 = 0.75.",
"تطبيقاتها في الحياة: الخصومات، الدرجات، نسب النجاح، الإحصاء."],
qs:[
{q:"50% من 200 تساوي:",o:["100","50","150","25"],a:0,e:"50% = النصف: 200 ÷ 2 = 100."},
{q:"25% من 40 تساوي:",o:["10","20","5","15"],a:0,e:"25% = الربع: 40 ÷ 4 = 10."},
{q:"10% من 300 تساوي:",o:["30","3","10","130"],a:0,e:"10% = العشر: 300 ÷ 10 = 30."},
{q:"خصم 20% على سلعة سعرها 150 جنيهًا، فكم تدفع؟",o:["120","130","100","110"],a:0,e:"تدفع 80%: 150 × 0.8 = 120."},
{q:"النسبة 100% تعني:",o:["الكل","النصف","الربع","لا شيء"],a:0,e:"100% = المبلغ كاملًا."}]},
{t:"الزوايا والمثلثات",p:[
"تنقسم الزوايا حسب قياسها إلى: حادة (أقل من 90°)، وقائمة (تساوي 90° تمامًا)، ومنفرجة (أكبر من 90° وأصغر من 180°).",
"الزاوية المنفرجة تجمع بين زاويتين قائمتين، والزاوية المستقيمة قياسها 180°.",
"أهم نظرية في هندسة المثلثات: مجموع قياسات الزوايا الداخلية في أي مثلث يساوي 180° دائمًا مهما اختلف شكل المثلث.",
"أنواع المثلثات حسب الأضلاع: متساوي الأضلاع (3 أضلاع متساوية وزواياه 60°)، ومتساوي الساقين، ومختلف الأضلاع. وحسب الزوايا: حاد الزاوية، وقائم الزاوية، ومنفرج الزاوية.",
"مثال: مثلث زاويتاه 50° و 60°، الزاوية الثالثة = 180 − 110 = 70°."],
qs:[
{q:"الزاوية التي قياسها 90° تسمى:",o:["قائمة","حادة","منفرجة","مستقيمة"],a:0,e:"90° زاوية قائمة."},
{q:"مجموع زوايا أي مثلث يساوي:",o:["180°","90°","360°","120°"],a:0,e:"مجموع الزوايا الداخلية للمثلث 180°."},
{q:"المثلث متساوي الأضلاع زواياه قياس كل منها:",o:["60°","90°","45°","30°"],a:0,e:"180 ÷ 3 = 60°."},
{q:"الزاوية قياسها 60° هي زاوية:",o:["حادة","منفرجة","قائمة","مستقيمة"],a:0,e:"أقل من 90° فهي حادة."},
{q:"مثلث إحدى زواياه 100° يُسمى مثلثًا:",o:["منفرج الزاوية","قائم الزاوية","حاد الزاوية","متساوي الأضلاع"],a:0,e:"وجود زاوية أكبر من 90° يجعله منفرج الزاوية."}]}]},
{name:"لغتي العربية",icon:"📖",color:"#e91e63",lessons:[
{t:"الفاعل والمفعول به",p:[
"الفاعل هو الاسم المرفوع الذي دلّى على من قام بالفعل، ويأتي دائمًا بعد الفعل المبني للمعلوم، وعلامة رفعه الضمة الظاهرة أو المقدرة.",
"المفعول به هو الاسم المنصوب الذي دلّى على من وقع عليه الفعل، وعلامة نصبه الفتحة الظاهرة أو المقدرة، ويأتي غالبًا بعد الفاعل.",
"تمييزهما عمليًا: اطرح سؤالين؛ من قام بالفعل؟ (الجواب: الفاعل)، وعلى من وقع الفعل؟ (الجواب: المفعول به).",
"مثال: كتبَ الطالبُ الدرسَ. من كتب؟ الطالب (فاعل مرفوع وعلامة رفعه الضمة). ماذا كتب؟ الدرس (مفعول به منصوب وعلامة نصبه الفتحة).",
"انتبه: إذا بُني الفعل للمجهول (كُتب الدرس) يحلّ نائب الفاعل محل الفاعل ويُرفع."],
qs:[
{q:"في جملة (كتبَ الطالبُ الدرسَ) الفاعل هو:",o:["الطالب","الدرس","كتب","لا فاعل"],a:0,e:"من قام بالكتابة؟ الطالب."},
{q:"المفعول به في الجملة السابقة هو:",o:["الدرس","الطالب","كتب","الجملة"],a:0,e:"على ماذا وقع الفعل؟ على الدرس."},
{q:"علامة إعراب الفاعل دائمًا:",o:["الرفع","النصب","الجر","السكون"],a:0,e:"الفاعل مرفوع دائمًا."},
{q:"في (شربَ الولدُ العصيرَ) المفعول به:",o:["العصير","الولد","شرب","لا مفعول"],a:0,e:"ماذا شرب؟ العصير."},
{q:"يأتي الفاعل بعد:",o:["الفعل المبني للمعلوم","الحرف","الضمير المتصل دائمًا","آخر الجملة دائمًا"],a:0,e:"الفاعل يتبع الفعل المبني للمعلوم مباشرة غالبًا."}]},
{t:"التشبيه",p:[
"التشبيه هو تشابه الشيء بغيره في صفة معينة لغرض البيان أو التقوية، وله أربعة أركان: المشبه (الشيء الأول)، والمشبه به (الشيء الثاني)، وأداة التشبيه (مثل، كأن)، ووجه الشبه (الصفة المشتركة).",
"أنواعه ثلاثة: التشبيه التمثيلي ويذكر فيه الأركان الأربعة كاملة، والتشبيه البليغ ويحذف فيه الأداة ووجه الشبه، والتشبيه المجازي ويحذف فيه وجه الشبه فقط.",
"مثال تمثيلي: العلم مثل النور يهتدي به في الظلام (المشبه: العلم، المشبه به: النور، الأداة: مثل، وجه الشبه: الهداية).",
"مثال مجازي: العلم نور — حُذف وجه الشبه فقط. ومثال بليغ: أسد في الميدان — حُذفت الأداة ووجه الشبه.",
"الغرض من التشبيه: توضيح المعنى، تقريب المجهول، إثارة الوجدان."],
qs:[
{q:"في (العلم مثل النور) الأداة هي:",o:["مثل","العلم","النور","لا أداة"],a:0,e:"مثل هي أداة التشبيه."},
{q:"الكلمات (العلم نور) نوعها:",o:["مجازي","تمثيلي","بليغ","حقيقي"],a:0,e:"حُذف وجه الشبه فقط فهو مجازي."},
{q:"عدد أركان التشبيه:",o:["أربعة","ثلاثة","خمسة","سبعة"],a:0,e:"مشبه، مشبه به، أداة، وجه شبه."},
{q:"أشهر أدوات التشبيه:",o:["مثل وكأن","في وعلى","لم ولن","قد وسوف"],a:0,e:"مثل، كأن، كال، شبيه."},
{q:"في (أسدٌ في الميدان) نوع التشبيه:",o:["بليغ","تمثيلي","مجازي","ضمني"],a:0,e:"حُذفت الأداة ووجه الشبه معًا."}]},
{t:"فهم النصوص المقروءة",p:[
"فهم النص هو القدرة على استخراج المعاني والمقاصد من القراءة، وهي مهارة أساسية تُقاس بها القراءة الحقيقية.",
"الفكرة الرئيسية هي الفكرة التي يدور حولها النص كله وتتكرر بصور مختلفة، بينما الفكرة الثانوية تخدم الفكرة الرئيسية وتدعمها.",
"الرأي هو ما يعبّر عن وجهة نظر الكاتب أو شعوره (أحب، أرى، يجب)، والحقيقة هي ما يمكن التأكد منه بالدليل والقياس.",
"استنتاج المعنى: قد تجد معنى كلمة غير مذكور صراحة، فتستنتجه من سياق الجمل قبلها وبعدها دون الرجوع للمعجم.",
"العنوان المناسب للنص: هو الذي يلخص فكرته العامة باختصار وجذابية."],
qs:[
{q:"الفكرة الرئيسية في النص هي:",o:["الفكرة التي يدور حولها النص","أول جملة دائمًا","آخر جملة دائمًا","أطول جملة"],a:0,e:"الفكرة المركزية التي يدور حولها النص."},
{q:"ما يعبّر عن شعور الكاتب ووجهة نظره يسمى:",o:["رأيًا","حقيقة","استنتاجًا","مقدمة"],a:0,e:"الرأي يحمل إعجاب الكاتب أو تفضيله."},
{q:"الاستنتاج هو:",o:["نتيجة نصل إليها بأنفسنا من النص","النص نفسه","عنوان النص","رأي الكاتب"],a:0,e:"الاستنتاج لا يُقال صراحة بل نصل إليه."},
{q:"معنى كلمة من السياق نستنتجه من:",o:["الجمل قبلها وبعدها","القاموس فقط","الحذف","التخمين الأعمى"],a:0,e:"السياق هو المرجع الأول للمعنى."},
{q:"العنوان المناسب للنص يجب أن:",o:["يعبّر عن الفكرة العامة","يكون طويلًا جدًا","يكون صعبًا","يكون اسمًا شخصيًا"],a:0,e:"العنوان الجيد يلخص الفكرة العامة."}]}]},
{name:"العلوم",icon:"🧪",color:"#4caf50",lessons:[
{t:"الخلية ومكوناتها",p:[
"الخلية هي وحدة بناء الكائن الحي والوحدة الوظيفية الأساسية فيه؛ فجميع الكائنات الحية تتكون من خلايا: نباتات، حيوانات، فطريات، بكتيريا.",
"المكونات الأساسية لأي خلية: الغشاء الخلوي (يتحكم في دخول وخروج المواد)، والسيتوبلازم (سائل يحدث فيه معظم التفاعلات)، والنواة (مركز التحكم وتحتوي على المادة الوراثية DNA).",
"الخلية النباتية تمتاز بوجود جدار خلوي من السليلوز يعطيها صلابة، وبلاستيدات خضراء تحتوي الكلوروفيل، وفجوة عصارية كبيرة لتخزين الماء.",
"الخلية الحيوانية تفتقر للجدار الخلوي والبلاستيدات، لذا تكون أكثر مرونة وتنوعًا في الأشكال.",
"تتكاثر الخلايا بالانقسام؛ الخليا النباتية الكبيرة ثابتة الشكل، والحيوانية متغيرة."],
qs:[
{q:"وحدة بناء الكائن الحي هي:",o:["الخلية","النسيج","العضو","الجزيء"],a:0,e:"الخلية هي لبنة الحياة الأساسية."},
{q:"مركز التحكم في الخلية هو:",o:["النواة","الغشاء","السيتوبلازم","الفجوة"],a:0,e:"النواة تتحكم في نشاط الخلية."},
{q:"يوجد الجدار الخلوي في:",o:["الخلية النباتية","الخلية الحيوانية","كليهما","لا أحد"],a:0,e:"الجدار الخلوي خاص بالنباتات."},
{q:"مادة الجدار الخلوي هي:",o:["السليلوز","الكيتين","الكولاجين","الدنا"],a:0,e:"الجدار النباتي من السليلوز."},
{q:"المادة الوراثية توجد في:",o:["النواة","الغشاء","السيتوبلازم","الفجوة العصارية"],a:0,e:"DNA موجود في النواة."}]},
{t:"الكهرباء والدوائر الكهربائية",p:[
"الدارة الكهربائية البسيطة تتكون من: مصدر للكهرباء (بطارية/عمود)، وأسلاك توصيل (موصلة)، وعنصر مستهلك (لمبة)، ومفتاح للتحكم في مرور التيار.",
"يشترط لمرور التيار الكهربائي أن تكون الدارة مغلقة، أي مكتملة الأجزاء بدون فواصل؛ فتح المفتاح يقطع التيار فتنطفئ اللمبة.",
"الموصلات تسمح بمرور التيار مثل النحاس والحديد والألومنيوم وماء البحر، بينما العوازل لا تسمح مثل البلاستيك والزجاج والخشب الجاف والمطاط — ولهذا تُغلف الأسلاك بالبلاستيك.",
"التيار الكهربائي هو انسياب الشحنات الكهربائية (الإلكترونات) في الموصل، ويقاس بوحدة الأمبير.",
"أخطار منزلية: لا تلمس المقابس بيد مبللة، ولا تستخدم أسلاكًا تالفة."],
qs:[
{q:"شرط مرور التيار الكهربائي:",o:["دارة مغلقة","دارة مفتوحة","بطارية ضعيفة","سلك طويل"],a:0,e:"لا يمر التيار إلا في دارة مغلقة."},
{q:"العنصر المولد للكهرباء في الدارة:",o:["البطارية","اللمبة","السلك","المفتاح"],a:0,e:"البطارية مصدر الطاقة الكهربائية."},
{q:"أيّ مما يلي مادة عازلة؟",o:["البلاستيك","النحاس","الحديد","ماء البحر"],a:0,e:"البلاستيك لا يمرر التيار."},
{q:"وظيفة المفتاح الكهربائي:",o:["فتح وغلق الدارة","تخزين الكهرباء","تحويل الكهرباء لضوء","زيادة الجهد"],a:0,e:"المفتاح يتحكم في انسياب التيار."},
{q:"مادة موصلة للكهرباء:",o:["النحاس","الخشب الجاف","الزجاج","المطاط"],a:0,e:"النحاس فلز موصل جيد."}]},
{t:"الجهاز الهضمي",p:[
"الجهاز الهضمي هو المسار الذي يمر فيه الطعام ليتحول إلى مواد بسيطة يمتصها الدم وينتفع بها الجسم، ويبدأ من الفم وينتهي بالشرج.",
"في الفم: تقوم الأسنان بالمضغ ويساعد اللعاب في ترطيب الطعام وبدء هضم النشويات. ثم ينتقل الطعام عبر المريء إلى المعدة.",
"في المعدة: تفرز عصارة معدية حمضية تحتوي على إنزيم الببسين الذي يهضم البروتينات، وتتحرك المعدة بحركات عضلية لتقليب الطعام.",
"في الأمعاء الدقيقة: يكتمل الهضم بعصارتها، وتتم عملية الامتصاص الحقيقي للغذاء إلى الدم عبر الزغابات المعوية.",
"في الأمعاء الغليظة: يمتص الماء والأملاح من بقايا الطعام، ثم تُخرج الفضلات من الجسم عبر الشرج."],
qs:[
{q:"يبدأ الهضم في:",o:["الفم","المعدة","الأمعاء الدقيقة","الشرج"],a:0,e:"المضغ واللعاب يبدآن في الفم."},
{q:"يمتص الغذاء المهضوم في:",o:["الأمعاء الدقيقة","المعدة","الفم","المريء"],a:0,e:"الامتصاص الحقيقي في الأمعاء الدقيقة."},
{q:"العصارة الهاضمة للبروتينات في المعدة تحتوي على إنزيم:",o:["الببسين","الأميليز","الليباز","الملاطف"],a:0,e:"الببسين يهضم البروتينات."},
{q:"يمتص الماء من بقايا الطعام في:",o:["الأمعاء الغليظة","الأمعاء الدقيقة","المعدة","المرارة"],a:0,e:"الغليظة تمتص الماء والأملاح."},
{q:"تحلل الدهون تساعد عليه العصارة:",o:["الصفراوية","المعدية","اللعابية","البنكرياسية فقط"],a:0,e:"عصارة المرارة (الصفراء) تحلل الدهون."}]}]},
{name:"اللغة الإنجليزية",icon:"🔤",color:"#ff9800",lessons:[
{t:"Present Simple (زمن المضارع البسيط)",p:[
"We use the Present Simple to talk about habits, daily routines, and facts: She goes to school every day.",
"With (he, she, it) we add (s) or (es) to the verb: play → plays, watch → watches, go → goes.",
"Negative: I/You/We/They + do not (don’t) + verb. He/She/It + does not (doesn’t) + verb (without s).",
"Question: Do you play football? Does she like tea? — Remember: after (does/doesn’t) the verb has no (s).",
"Time expressions: always, usually, sometimes, never, every day, on Fridays."],
qs:[
{q:"She ___ to school every day.",o:["goes","go","going","went"],a:0,e:"With (she) we add (s): goes."},
{q:"نفي الجملة مع (I):",o:["I don’t like tea","I doesn’t like tea","I not like tea","I no like tea"],a:0,e:"With I/You/We/They we use (don’t)."},
{q:"He ___ TV every evening.",o:["watches","watch","watching","watched"],a:0,e:"With (he): watch + es = watches."},
{q:"يُستخدم المضارع البسيط للحديث عن:",o:["العادات والحقائق","الماضي","المستقبل","أمر حدث الآن"],a:0,e:"Present Simple for habits and facts."},
{q:"They ___ football on Fridays.",o:["play","plays","playing","played"],a:0,e:"With (they) the verb stays without s."}]},
{t:"Past Simple (زمن الماضي البسيط)",p:[
"We use the Past Simple for actions that finished in the past: yesterday, last week, two days ago.",
"Regular verbs add (ed): play → played, watch → watched, study → studied.",
"Irregular verbs change completely: go → went, eat → ate, see → saw, buy → bought, write → wrote. You must memorize them!",
"Negative and question use (did / didn’t) + base verb: I didn’t go. Did you see him?",
"Time expressions: yesterday, last night, ago, in 2020."],
qs:[
{q:"الماضي من الفعل (go) هو:",o:["went","goed","going","goes"],a:0,e:"go is irregular: go → went."},
{q:"يُستخدم الماضي البسيط للتعبير عن:",o:["أفعال انتهت في الماضي","عادات يومية","حقائق علمية","مستقبل"],a:0,e:"Past Simple = finished past actions."},
{q:"I ___ my homework yesterday.",o:["did","do","does","doing"],a:0,e:"With (did) we use the base verb: did."},
{q:"الماضي من (eat) هو:",o:["ate","eated","eaten","eats"],a:0,e:"eat is irregular: eat → ate."},
{q:"الأفعال الشاذة هي الأفعال التي:",o:["لا تتبع قاعدة إضافة ed","تنتهي بـ ing","تأخذ always","لا معنى لها"],a:0,e:"Irregular verbs change completely."}]},
{t:"Reading: Daily Routine (قراءة: الروتين اليومي)",p:[
"Daily routine vocabulary: get up = أستيقظ، brush my teeth = أغسل أسناني، have breakfast = أتناول الفطور، get dressed = أرتدي ملابسي، go to school = أذهب إلى المدرسة، do my homework = أؤدي واجبي، go to bed = أنام.",
"A typical routine in order: I get up at 7 o’clock. I brush my teeth and wash my face. I have breakfast with my family. Then I go to school.",
"Reading skill: pay attention to sequence words: first, then, after that, finally (أولًا، ثم، بعد ذلك، أخيرًا).",
"We use the Present Simple with daily routines because they are habits that repeat every day.",
"Try writing your own routine in 5 sentences using the sequence words!"],
qs:[
{q:"أول فعل في روتين الصباح غالبًا:",o:["get up","go to bed","have dinner","watch TV"],a:0,e:"You get up first, then everything else."},
{q:"(brush my teeth) تعني:",o:["أغسل أسناني","أرتدي ملابسي","أتناول الفطور","أذهب للمدرسة"],a:0,e:"brush my teeth = غسل الأسنان."},
{q:"(have breakfast) تعني:",o:["أتناول الفطور","أستيقظ","أغسل الوجه","أذهب للنوم"],a:0,e:"have breakfast = تناول الفطور."},
{q:"نستخدم المضارع البسيط في الروتين لأنه:",o:["عادة تتكرر يوميًا","حدث ماضٍ","خبر عاجل","حلم"],a:0,e:"Routines are repeated habits."},
{q:"(go to school) تعني:",o:["أذهب إلى المدرسة","أذهب للنوم","أعود للمنزل","ألعب الكرة"],a:0,e:"go to school = الذهاب للمدرسة."}]}]}]},
{name:"🔴 المرحلة الثانوية",subjects:[
{name:"الرياضيات",icon:"🔢",color:"#4a90d9",lessons:[
{t:"الدوال",p:[
"الدالة هي قاعدة تربط كل عنصر من مجموعة (المجال) بعنصر واحد فقط من مجموعة أخرى (المدى)، وتكتب f(x) وتُقرأ دالة أف بالسين.",
"المجال هو مجموعة قيم المدخلات المسموح بها، والمدى هو مجموعة قيم المخرجات الناتجة. مثلًا في f(x)=2x+1 المجال كل الأعداد الحقيقية.",
"لحساب قيمة دالة عند عدد معين: عوّض مكان x. مثال: f(x)=2x+1 عند x=3 فإن f(3)=2(3)+1=7.",
"أنواع مهمة: الدالة الخطية (صورتها ax+b وتمثيلها خط مستقيم)، والدالة التربيعية (ax²+bx+c وتمثيلها قطع مكافئ/بارابولا).",
"الدالة الزوجية تحقق f(−x)=f(x) (متماثلة حول محور y)، والفردية تحقق f(−x)=−f(x) (متماثلة حول الأصل)."],
qs:[
{q:"في الدالة يرتبط كل عنصر من المجال بـ:",o:["عنصر واحد فقط من المدى","عنصرين من المدى","ثلاثة عناصر","لا شيء"],a:0,e:"Definition of a function: one output for each input."},
{q:"إذا f(x) = 2x + 1 فإن f(3) =",o:["7","6","8","5"],a:0,e:"f(3) = 2×3 + 1 = 7."},
{q:"مجال الدالة الخطية f(x)=3x هو:",o:["جميع الأعداد الحقيقية","الأعداد الموجبة فقط","الأعداد الصحيحة فقط","الأعداد السالبة فقط"],a:0,e:"Linear functions are defined for all real numbers."},
{q:"إذا f(x) = x² فإن f(-2) =",o:["4","-4","2","-2"],a:0,e:"(−2)² = 4."},
{q:"المدى في الدالة هو مجموعة:",o:["المخرجات","المدخلات","الثوابت","المعاملات"],a:0,e:"Range = set of outputs."}]},
{t:"مفهوم المشتقة",p:[
"المشتقة هي معدل التغير اللحظي للدالة، وهي قيمة ميل المماس لمنحنى الدالة عند نقطة معينة، وتفتح بابًا لفهم السرعة والتسارع والنمو.",
"الفكرة الهندسية: ميل القاطع يقترب من ميل المماس كلما اقترب النقطة الثانية من الأولى، وهذا هو النهاية التي تُعرّف المشتقة.",
"أهم قاعدتين: مشتقة الثابت تساوي صفرًا (لأنه لا يتغير)، ومشتقة x أس n تساوي n × x أس (n−1).",
"أمثلة تطبيقية: مشتقة x² هي 2x، ومشتقة 3x هي 3، ومشتقة 5 هي 0، ومشتقة x³ هي 3x².",
"القاعدة الخطية: مشتقة مجموع دوال هي مجموع مشتقاتها، ويمكن إخراج الثابت خارج المشتقة."],
qs:[
{q:"مشتقة x² هي:",o:["2x","x","x²","2"],a:0,e:"مشتقة x^n = n·x^(n−1) → 2x."},
{q:"مشتقة الثابت (5) تساوي:",o:["0","5","1","x"],a:0,e:"الثابت لا يتغير فمشته صفر."},
{q:"مشتقة 3x هي:",o:["3","3x","x","0"],a:0,e:"مشتدة 3x = 3."},
{q:"المشتقة هندسيًا تمثل:",o:["ميل المماس","المساحة","الحجم","الزاوية"],a:0,e:"The derivative is the slope of the tangent."},
{q:"مشتقة x³ هي:",o:["3x²","3x","x²","3"],a:0,e:"مشتقة x³ = 3x²."}]},
{t:"حساب المثلثات",p:[
"حساب المثلثات يدرس العلاقات بين أضلاع المثلث القائم وزواياه عبر النسب المثلثية: الجيب (sin) = الضلع المقابل ÷ الوتر، وجيب التمام (cos) = المجاور ÷ الوتر، والظل (tan) = المقابل ÷ المجاور.",
"الوتر هو أطول أضلاع المثلث القائم ويقع مقابل الزاوية القائمة دائمًا.",
"القيم الأساسية التي يجب حفظها: sin 30° = 1/2، cos 60° = 1/2، sin 45° = cos 45° = √2/2، tan 45° = 1.",
"أهم علاقة في المثلثات: sin²θ + cos²θ = 1 لأي زاوية θ — وتُشتق مباشرة من نظرية فيثاغورس.",
"تطبيقات عملية: قياس ارتفاعات الأبراج والأشجار غير القابلة للقياس المباشر باستخدام زاوية الارتفاع وظلها."],
qs:[

{name:"لغتي العربية",icon:"📖",color:"#e91e63",lessons:[
{t:"الإعراب (الرفع والنصب)",p:[
"الإعراب هو تغيير أواخر الكلمات لتبين معناها في الجملة، وتقسم الكلمات من حيث الإعراب إلى مرفوع ومنصوب ومجرور ومجزوم.",
"المرفوعات: المبتدأ والخبر (مثل: العلمُ نورٌ)، والفاعل (قرأَ الولدُ)، ونائب الفاعل (قُتل العدوُ)، والاسم بعد كان وأخواتها، والحال في بعض الحالات.",

{t:"الأدب: العصر العباسي",p:[

{t:"الأساليب اللغوية والبلاغية",p:[

{name:"العلوم",icon:"🧪",color:"#4caf50",lessons:[
{t:"قوانين نيوتن للحركة",p:[
"صاغ نيوتن ثلاثة قوانين أساسية للحركة أصبحت حجر الأساس في علم الميكانيكا الكلاسيكي.",
"القانون الأول (قصور الذاتي): الجسم الساكن يبقى ساكنًا والمتحرك يستمر في حركته المستقيمة بسرعة ثابتة ما لم تؤثر عليه قوة محصلة تغير حالته — فالأشياء تقاوم التغير في حالتها.",

{q:"قصور الذاتي يعني:",o:["ممانعة الجسم لتغير حالته","سرعة الجسم","كتلة الجسم","جاذبية الأرض"],a:0,e:"Inertia resists change in motion."},

{t:"الكيمياء: الجدول الدوري",p:[
"الجدول الدوري الحديث يرتب العناصر تصاعديًا حسب عددها الذري (عدد البروتونات)، وهو اكتشاف يعود أساسًا إلى مندليف ثم تطور لاحقًا.",
"يتكون الجدول من صفوف أفقية تسمى الدورات (الدورة الأولى عنصران فقط: هيدروجين وهيليوم)، وأعمدة رأسية تسمى المجموعات، والعناصر الواقعة في نفس المجموعة تتشابه في خصائصها الكيميائية.",
"ينقسم العناصر إلى: فلزات (مثل الحديد والنحاس والألومنيوم)، ولافلزات (أكسجين ونيتروجين وكربون)، وأشباه فلزات (سليكون وجرمانيوم) لها خصائص متوسطة.",
"الليثيوم أول عناصر المجموعة الأولى وعدده الذري 3، وخصائص عناصر المجموعة تتكرر دوريًا كل مجموعة — ومن هنا جاء اسم الجدول الدوري.",

{q:"الصفوف الأفقية في الجدول تسمى:",o:["الدورات","المجموعات","الفئات","العائلات"],a:0,e:"Horizontal rows are called periods."},
{q:"الأعمدة الرأسية في الجدول تسمى:",o:["المجموعات","الدورات","السلاسل","الكتل"],a:0,e:"Vertical columns are groups."},
{q:"العناصر الواقعة في نفس المجموعة:",o:["تتشابه في خصائصها","متطابقة تمامًا","لا علاقة بينها","كلها غازات"],a:0,e:"Same group = similar chemical properties."},

{t:"الأحياء: أساسيات الوراثة",p:[
"الوراثة هي انتقال الصفات من الآباء إلى الأبناء عبر المادة الوراثية DNA التي تحمل الشيفرة الوراثية وتوجد داخل النواة على شكل شريط لولبي مزدوج.",
"الكروموسومات هي حاملات الجينات، والجينات هي وحدات الوراثة التي تحدد كل صفة (لون العينين، فصيلة الدم، الطول).",

{name:"اللغة الإنجليزية",icon:"🔤",color:"#ff9800",lessons:[
{t:"Essay Writing (كتابة المقال)",p:[
"A good essay has three parts: an Introduction (introduces the topic and your opinion), a Body (2–3 paragraphs, each with one main idea and supporting details), and a Conclusion (summarizes your ideas and gives a final opinion).",
"Each body paragraph should start with a topic sentence (the main idea), followed by explanations and examples.",
"Useful linking words: Firstly (أولًا)، Moreover (علاوة على ذلك)، However (ومع ذلك)، For example (على سبيل المثال)، In conclusion (في الخلاصة).",
"Avoid repeating the same words; use synonyms: important = essential = vital.",
"Plan before you write: brainstorm ideas, order them, then write — and always leave time to check grammar and spelling."],
qs:[
{q:"The first part of an essay is the:",o:["introduction","conclusion","body","title page"],a:0,e:"The essay starts with an introduction."},
{q:"Linking words help to:",o:["organize ideas clearly","make the essay longer","avoid thinking","repeat ideas"],a:0,e:"They connect ideas smoothly."},
{q:"In the conclusion we usually:",o:["summarize the main ideas","introduce new topics","write the title","ask questions only"],a:0,e:"The conclusion summarizes and gives final thoughts."},
{q:"(Moreover) means:",o:["علاوة على ذلك","ومع ذلك","في الختام","مثلاً"],a:0,e:"Moreover = in addition / علاوة على ذلك."},
{q:"A good paragraph starts with:",o:["a topic sentence","a question mark","the writer's name","a full stop"],a:0,e:"Topic sentence states the main idea."}]},
{t:"Conditionals (الجمل الشرطية)",p:[
"Type 0 (general truth): If + present simple, + present simple — If you heat ice, it melts. (حقيقة علمية دائمة)",
"Type 1 (real future): If + present simple, + will + verb — If it rains, we will stay at home. (احتمال حقيقي في المستقبل)",
"Type 2 (unreal present): If + past simple, + would + verb — If I were rich, I would buy a car. (تخيل نقيض الواقع)",
"Type 3 (unreal past): If + past perfect, + would have + past participle — If you had studied, you would have passed. (ندم على ماضٍ)",
"Golden rule: never use (will) after (if) — If it will rain is wrong; say If it rains."],
qs:[
{q:"If it rains, we ___ at home.",o:["will stay","stay","stayed","stays"],a:0,e:"Type 1: If + present, will + verb."},
{q:"If I were rich, I ___ buy a car.",o:["would","will","am going to","buy"],a:0,e:"Type 2: If + past, would + verb."},
{q:"If you heat ice, it ___:",o:["melts","melt","melted","will melts"],a:0,e:"Type 0 general truth: melts."},
{q:"Type 2 conditional talks about:",o:["unreal situations in the present","past facts","daily habits","future plans"],a:0,e:"Imaginary present situations."},
{q:"If she studies hard, she ___ pass.",o:["will","would","is","past"],a:0,e:"Type 1: will + verb."}]},
{t:"Phrasal Verbs (الأفعال المركبة)",p:[
"Phrasal verbs are verbs combined with prepositions or adverbs that create a new meaning: give up = يستسلم، look after = يعتني بـ، turn off = يطفئ، find out = يكتشف، put on = يرتدي، look for = يبحث عن، get up = يستيقظ.",
"Small words change the meaning completely: turn on = يشغل، but turn off = يطفئ. Look up = يبحث في قاموس، look down on = يحتقر.",
"The most common ones for students: give up smoking (أقلع عن التدخين)، find out the truth (اكتشف الحقيقة)، take off (اخلع/اقلب... حسب السياق!).",
"Tip: learn phrasal verbs in sentences, not as isolated lists — context is the key.",
"Note: some phrasal verbs are separable (turn the light off = turn off the light) and some are not (look after the baby — never look the baby after)."],
qs:[
{q:"(give up) means:",o:["يستسلم","يستمر","يعطي","يقف"],a:0,e:"give up = quit / يستسلم."},
{q:"(look after) means:",o:["يعتني بـ","يبحث عن","ينظر إلى","يهمل"],a:0,e:"look after = take care of."},
{q:"(turn off) the lights means:",o:["اطفئ الأنوار","شغّل الأنوار","افتح النوافذ","نظف الغرفة"],a:0,e:"turn off = switch off / يطفئ."},
{q:"(find out) means:",o:["يكتشف","يفقد","يبحث","يجد فقط"],a:0,e:"find out = discover."},
{q:"(put on) means:",o:["يرتدي","يخلع","يضع فوق الطاولة","يؤجل"],a:0,e:"put on = wear / يرتدي."}]}]}]}];

DATA.forEach((stage,si)=>stage.subjects.forEach((s,sj)=>s.lessons.forEach((L,lk)=>{
  const keys = new Set();
  const addW = w => { const n = norm(w).replace(/^ال/,''); if(n.length>2) keys.add(n); };
  L.t.split(/[\s،]+/).forEach(addW);
  s.name.split(/\s+/).forEach(addW);
  stage.name.split(/\s+/).forEach(addW);
  TOPICS.push({si,sj,lk,L,keys:[...keys]});
})));

/* ================= أدوات لغوية وماركداون ================= */
function norm(s){
  return (s||'').toString()
    .replace(/[\u064B-\u0652\u0670]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\p{L}\p{N}\s]/gu,' ').toLowerCase().trim();
}
function isArabic(s){ const a=(s.match(/[\u0600-\u06FF]/g)||[]).length; const l=(s.match(/[a-zA-Z]/g)||[]).length; return a>=l; }

/* محول ماركداون خفيف وسريع لتحسين مظهر ردود الذكاء الاصطناعي */
function renderMarkdown(md){
  if(!md) return '';
  let h = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // عناوين
  h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  h = h.replace(/^# (.*$)/gim, '<h2>$1</h2>');

  // خط عريض ومائل
  h = h.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');

  // أكواد
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

  // قوائم نقطية ورقمية
  h = h.replace(/^\s*[-*•]\s+(.*)$/gim, '<li>$1</li>');
  h = h.replace(/^\s*(\d+)\.\s+(.*)$/gim, '<li>$2</li>');
  h = h.replace(/(<li>.*<\/li>)/gms, '<ul>$1</ul>');
  // إزالة تكرار ul المتجاورة
  h = h.replace(/<\/ul>\s*<ul>/g, '');

  // الأسطر الفارغة والفقرات
  h = h.replace(/\n\n+/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');

  return '<p>' + h + '</p>';
}

/* ================= الصوت (TTS) ================= */
function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang)) ||
         vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.split('-')[0])) || null;
}
function speak(text, lang, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = rate||0.95;
  const v = pickVoice(lang); if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ================= الإدخال الصوتي (STT) ================= */
let rec=null, recOn=false;
function toggleMic(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn = document.getElementById('micBtn');
  if(!SR){ addMsg('متصفحك لا يدعم الإدخال الصوتي، لكن يمكنك الكتابة دائمًا ✍️','ai'); return; }
  if(recOn && rec){ rec.stop(); return; }
  rec = new SR();
  rec.lang = 'ar-SA'; rec.interimResults=false;
  rec.onstart = ()=>{ recOn=true; btn.classList.add('rec'); };
  rec.onend = ()=>{ recOn=false; btn.classList.remove('rec'); };
  rec.onerror = ()=>{ recOn=false; btn.classList.remove('rec'); addMsg('لم أسمع جيدًا، حاول مرة أخرى أو اكتب سؤالك 🎤','ai'); };
  rec.onresult = e=>{
    const t=e.results[0][0].transcript;
    document.getElementById('txt').value=t;
    setTimeout(sendFromInput, 300);
  };
  try{ rec.start(); }catch(e){}
}

    };

    qz.onclick = ()=>{

/* ================= محرك الذكاء الاصطناعي الحقيقي (مجاني 100% بدون API Key) ================= */
async function fetchRealAI(userQuery){
  // بناء سياق الرسائل
  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    ...chatHistory.slice(-6), // الاحتفاظ بآخر 6 رسائل لضمان ترابط الحوار
    { role: 'user', content: userQuery }
  ];

  // المحاولة الأولى: POST مع سياق المحادثة
  try{
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 20000);
    const res = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        messages: messages,
        model: 'openai',
        seed: Math.floor(Math.random() * 100000)
      }),
      signal: ctrl.signal
    });
    clearTimeout(to);
    if(res.ok){
      const text = await res.text();
      if(text && text.trim().length > 5 && !text.startsWith('{"error"')){
        return text.trim();
      }
    }
  }catch(e){
    console.warn('POST attempt failed, trying GET fallback...', e);
  }

  // المحاولة الثانية: GET بطلب مباشر مع معلمات النظام
  try{
    const ctrl2 = new AbortController();
    const to2 = setTimeout(()=>ctrl2.abort(), 18000);
    const fullPrompt = `${SYSTEM_PROMPT}\n\nسؤال الطالب: ${userQuery}`;
    const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=mistral&cache=false`;
    const res2 = await fetch(url, { signal: ctrl2.signal });
    clearTimeout(to2);
    if(res2.ok){
      const text2 = await res2.text();
      if(text2 && text2.trim().length > 5 && !text2.startsWith('{"error"')){
        return text2.trim();
      }
    }
  }catch(e){
    console.warn('GET fallback failed', e);
  }

  return null; // تعذر الوصول إلى السيرفر
}

/* معالجة سؤال الطالب بالذكاء الاصطناعي الحقيقي */
async function handleAIQuery(query){
  showTyping();

  const aiResponse = await fetchRealAI(query);
  hideTyping();

  const lang = isArabic(query) ? 'ar' : 'en';

  if(aiResponse){
    // نجاح الحصول على الإجابة من الذكاء الاصطناعي الحقيقي!
    chatHistory.push({ role: 'user', content: query });
    chatHistory.push({ role: 'assistant', content: aiResponse });

    // إضافة نقاط وتشجيع للطالب
    points += 5;
    store.set('points', points);
    updateHeader();

    addMsg(aiResponse, 'ai', {
      markdown: true,
      lang: lang === 'ar' ? 'ar-SA' : 'en-US',
      src: lang === 'ar' ? '✨ إجابة حية من الذكاء الاصطناعي' : '✨ Live AI Response'
    });
  } else {
    // حالة عدم توفر اتصال بالإنترنت: البحث في المكتبة المحلية للطوارئ
    handleOfflineFallback(query, lang);
  }
}

/* خطة الطوارئ عند انقطاع الإنترنت فقط */
function handleOfflineFallback(query, lang){
  const words = new Set(norm(query).split(/\s+/).filter(w=>w.length>2).map(w=>w.replace(/^ال/,'')));
  let best=null, bestScore=0;
  TOPICS.forEach(tp=>{
    let score = 0;
    tp.keys.forEach(k=>{ if(words.has(k)) score += 3; });
    if(score > bestScore){ bestScore = score; best = tp; }
  });

  if(best && bestScore >= 3){
    const {L} = best;
    const stage = DATA[best.si], subj = stage.subjects[best.sj];
    const paras = L.p.map(p=>`<p style="margin:0 0 8px;">${p}</p>`).join('');
    const body = `⚠️ <b>ملاحظة:</b> تعذر الاتصال بسيرفر الذكاء الاصطناعي (تأكد من اتصالك بالإنترنت).<br>ولكن إليك شرح الدرس من <b>المكتبة المدمجة</b>:<br><br><b>📖 ${L.t}</b> (${subj.name})<br>${paras}<br><b>💡 ملخص:</b> ${L.qs[0].e}`;
    addMsg(body, 'ai', {
      html: true,
      lang: lang==='ar'?'ar-SA':'en-US',
      src: '📚 من المكتبة المدمجة (وضع عدم الاتصال)'
    });
  } else {
    const errorMsg = lang==='ar'
      ? '⚠️ <b>تعذر الاتصال بالذكاء الاصطناعي:</b> يرجى التأكد من اتصال جهازك بالإنترنت لتتمكن من سؤال المعلم الذكي والحصول على إجاباته الحية.<br><br>💡 في حال عدم توفر إنترنت، يمكنك تصفح الدروس الجاهزة مباشرة من تبويب <b>📚 المكتبة المدمجة</b>!'
      : '⚠️ <b>Could not connect to AI:</b> Please ensure your device is connected to the internet to receive live AI answers.<br><br>💡 You can also browse offline lessons in the <b>📚 Built-in Library</b> tab!';
    addMsg(errorMsg, 'ai', {html:true, lang: lang==='ar'?'ar-SA':'en-US'});
  }
}

/* ================= الاختبار التفاعلي داخل الدردشة ================= */
let cq=null;
function startChatQuiz(tp){
  stopSpeak();
  cq = {tp, i:0, score:0, total:tp.L.qs.length, order:null};
  addMsg(`ممتاز! لنختبر معلوماتك في درس <b>"${tp.L.t}"</b> 📝 أجب عن الأسئلة التالية:`,'ai',{html:true, lang:'ar-SA'});
  askChatQ();
}

function askChatQ(){
  const q = cq.tp.L.qs[cq.i];
  cq.order = q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
  const m = document.createElement('div'); m.className='msg ai';
  m.innerHTML = `<div class="avatar">🤖</div>`;
  const b = document.createElement('div'); b.className='bubble';
  b.innerHTML = `<b>س${cq.i+1}/${cq.total}:</b> ${q.q}`;
  const row = document.createElement('div'); row.className='bubble-actions';
  cq.order.forEach(oi=>{
    const btn = document.createElement('button');
    btn.className = 'mini';
    btn.style.background = 'rgba(74,144,217,.14)';
    btn.style.color = 'var(--text)';
    btn.style.fontSize = '.9rem';
    btn.textContent = q.o[oi];
    btn.onclick = ()=>answerChat(btn, oi, q, row);
    row.appendChild(btn);
  });
  b.appendChild(row); m.appendChild(b); log.appendChild(m); scrollChat();
}

function answerChat(btn, oi, q, row){
  [...row.children].forEach(b=>b.disabled=true);
  const ok = oi===q.a; cq.lastOk = ok;
  if(ok){
    btn.style.background='var(--good)'; btn.style.color='#fff'; cq.score++; beep(880,.15);
  } else {
    btn.style.background='var(--bad)'; btn.style.color='#fff'; beep(180,.25);
    [...row.children].forEach((b,bi)=>{ if(cq.order[bi]===q.a){ b.style.background='var(--good)'; b.style.color='#fff'; }});
  }
  answers.t++; if(ok) answers.c++; store.set('ans',answers);
  addMsg('💡 ' + q.e, 'ai', {noActions:true});
  
  const nxt = document.createElement('button');
  nxt.className = 'mini quiz';
  nxt.style.marginTop = '6px';
  nxt.textContent = cq.i===cq.total-1 ? '🏁 عرض النتيجة' : 'السؤال التالي ⬅';
  nxt.onclick = ()=>{
    nxt.remove();
    (cq.i===cq.total-1)?finishChatQuiz():(cq.i++,askChatQ());
  };
  log.lastChild.querySelector('.bubble').appendChild(nxt);
  scrollChat();
}

function finishChatQuiz(){
  const pct = cq.score/cq.total;
  const gained = cq.score*20; points+=gained;
  const id = cq.tp.si+'-'+cq.tp.sj+'-'+cq.tp.lk;
  const first = !doneLessons.includes(id);
  if(pct>=0.6 && first) doneLessons.push(id);
  store.set('points',points); store.set('done',doneLessons);
  const msg = pct===1?'درجة كاملة! أنت مذهل 🏆':pct>=0.8?'رائع جدًا! 🌟':pct>=0.6?'جيد! استمر 👍':'لا بأس، راجع الشرح وحاول مجددًا 💪';
  addMsg(`النتيجة: <b>${cq.score} / ${cq.total}</b><br>${msg}<br>حصلت على <b>+${gained}</b> نقطة ${first&&pct>=0.6?'• درس مكتمل ✔':''}`,'ai',{html:true, lang:'ar-SA'});
  if(pct>=0.6) confetti();
  updateHeader();
}

/* ================= تصفح المكتبة ================= */
let libPath = {si:null, sj:null};
function renderLib(){
  const body = document.getElementById('libBody');
  const title = document.getElementById('libTitle');
  if(libPath.si===null){
    title.textContent='📚 اختر المرحلة التعليمية';
    body.innerHTML = '<div class="grid subjects">'+DATA.map((st,i)=>
      `<button class="subj" style="background:${['#4a90d9','#7b5ce0','#e05571'][i]}" onclick="libStage(${i})"><span class="ic">${['🟢','🔵','🔴'][i]}</span>${st.name.replace(/^[^\s]+\s/,'')}</button>`).join('')+'</div>';
  } else if(libPath.sj===null){
    title.textContent = DATA[libPath.si].name + ' — اختر المادة';
    body.innerHTML = '<button class="li" onclick="libBack()"><span class="num" style="background:var(--muted)">→</span><span class="lt">رجوع للمراحل</span></button>' +
      '<div class="grid subjects">'+DATA[libPath.si].subjects.map((s,j)=>
      `<button class="subj" style="background:${s.color}" onclick="libSubj(${j})"><span class="ic">${s.icon}</span>${s.name}</button>`).join('')+'</div>';
  } else {
    const s = DATA[libPath.si].subjects[libPath.sj];
    title.textContent = s.icon+' '+s.name;
    body.innerHTML = '<button class="li" onclick="libPath.sj=null;renderLib()"><span class="num" style="background:var(--muted)">→</span><span class="lt">رجوع للمواد</span></button>' +
      s.lessons.map((L,k)=>{
        const id=libPath.si+'-'+libPath.sj+'-'+k;
        return `<button class="li" onclick="openLibLesson(${k})"><span class="num" style="background:${s.color}">${k+1}</span><span class="lt">${L.t}</span>${doneLessons.includes(id)?'<span class="done">✔</span>':''}</button>`;
      }).join('');
  }
}
function libStage(i){ libPath={si:i,sj:null}; renderLib(); }
function libSubj(j){ libPath.sj=j; renderLib(); }
function libBack(){ libPath={si:null,sj:null}; renderLib(); }
function openLibLesson(k){
  const tp = TOPICS.find(t=>t.si===libPath.si && t.sj===libPath.sj && t.lk===k);
  lastTopic = tp;
  switchTab('chat');
  openCuratedLesson(tp);
}

/* ================= تبويبات وإعدادات ================= */
function switchTab(t){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+t).classList.add('active');
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.t===t));
  if(t==='lib') renderLib();
  if(t==='stats') renderStats();
}

function toggleDark(){ dark=!dark; store.set('dark',dark); applyDark(); }
function applyDark(){ document.body.classList.toggle('dark',dark); document.getElementById('darkBtn').textContent=dark?'☀️':'🌙'; }
function fontSize(d){ fontScale=Math.min(1.35,Math.max(.85,fontScale+d*.1)); document.documentElement.style.fontSize=(16*fontScale)+'px'; store.set('font',fontScale); }

function renderStats(){
  document.getElementById('stDone').textContent=doneLessons.length;
  document.getElementById('stPoints').textContent=points;
  document.getElementById('stAcc').textContent=answers.t?Math.round(answers.c/answers.t*100)+'%':'—';
  document.getElementById('stAsk').textContent=asked;
  const s=streak();
  document.getElementById('streakCard').innerHTML = (s.count>1?`🔥 استمراريتك في التعلم: <b>${s.count} أيام</b> متتالية — أنت تتفوق يومًا بعد يوم!`:'🔥 ابدأ رحلتك اليوم: اسأل المعلم الذكي سؤالًا واحدًا على الأقل يوميًا لتبني استمراريتك!') + '<br>💡 اسأل المعلم الذكي أي سؤال في المناهج أو المعارف العامة وسيجيبك بذكائه الحقيقي فوراً!';
}

function updateHeader(){
  document.getElementById('pointsBadge').textContent='🏆 '+points;
  document.getElementById('streakBadge').textContent='🔥 '+streak().count;
}

function streak(){
  const today=new Date().toDateString();
  let s=store.get('streak',{last:null,count:0});
  if(s.last!==today){
    const y=new Date(Date.now()-86400000).toDateString();
    s.count=(s.last===y)?s.count+1:1;
    s.last=today;
    store.set('streak',s);
  }
  return s;
}

/* ================= مؤثرات ================= */
function beep(f,d){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+d);
  }catch(e){}
}

function confetti(){
  const em=['🎉','⭐','🌟','✨','🎊','💙'];
  for(let i=0;i<36;i++){
    const s=document.createElement('span'); s.className='confetti'; s.textContent=em[i%em.length];
    s.style.right=Math.random()*100+'vw'; s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),3400);
  }
}

document.documentElement.style.fontSize=(16*fontScale)+'px';
